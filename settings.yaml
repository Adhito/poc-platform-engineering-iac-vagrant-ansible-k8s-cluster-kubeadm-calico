---
# cluster_name is used to group the nodes in a folder within VirtualBox:
cluster_name: Development Kubernetes Cluster Kubeadm Calico Vagrant Ansible
# Uncomment to set environment variables for services such as crio and kubelet.
# For example, configure the cluster to pull images via a proxy.
# environment: |
#   HTTP_PROXY=http://my-proxy:8000
#   HTTPS_PROXY=http://my-proxy:8000
#   NO_PROXY=127.0.0.1,localhost,master-node,node01,node02,node03
# All IPs/CIDRs should be private and allowed in /etc/vbox/networks.conf.
# CPU : 1,2,4,8
# RAM : 2048, 4096, 8192 

network:
  # Worker IPs are simply incremented from the control IP.
  # control_ip: 10.0.0.10
  control_ip: 192.168.56.10
  dns_servers:
    - 8.8.8.8
    - 1.1.1.1
  pod_cidr: 172.16.1.0/16
  service_cidr: 172.17.1.0/18
  # IP range MetalLB hands out to LoadBalancer services. This repo is the single owner of MetalLB
  # and ingress-nginx (platform decision, 2026-09-23); app repos only create Ingresses/Services.
  # Must not overlap node IPs (192.168.56.10-.1N), the Dev VM (.20), or your VirtualBox hostonly
  # DHCP range. Reserved inside it: .240 ingress-nginx (below), .241 Vault (vault-lb).
  # Every app hostname is <name>.192.168.56.240.nip.io - don't move the pool without moving that.
  metallb_ip_range: 192.168.56.240-192.168.56.250
  # The ingress-nginx controller's pinned LoadBalancer IP (metallb.io/loadBalancerIPs).
  ingress_nginx_loadbalancer_ip: 192.168.56.240
  # Only for reusing an ingress-nginx this repo does NOT install (software.ingress_nginx empty):
  # the LB IP of that controller, for the ArgoCD Ingress. Empty while this repo owns the controller.
  existing_ingress_nginx_lb_ip: ""
nodes:
  control:
    cpu: 4
    memory: 8192
  workers:
    count: 2
    cpu: 4
    memory: 8192
# Mount additional shared folders from the host into each virtual machine.
# Note that the project directory is automatically mounted at /vagrant.
# shared_folders:
#   - host_path: ../images
#     vm_path: /vagrant/images
software:
  box: bento/ubuntu-22.04
  # Versions verified against each project's compatibility matrix for Kubernetes 1.36 on 2026-09-22.
  # Calico 3.32 is tested on K8s 1.34-1.36.
  calico: 3.32.2
  # To skip the dashboard installation, set its version to an empty value or comment it out.
  # NOTE: upstream archived the Dashboard in Jan 2026 (Headlamp is the successor). Left as-is pending
  # its own ticket. Its components manifest also re-applies a bundled metrics-server v0.7.1 over the
  # one pinned below - see documents/DOCUMENTS-backlog.md.
  dashboard: 2.7.0
  # CRI-O follows this minor automatically (its apt repo is derived from it) - never set it separately.
  kubernetes: 1.36.4-*
  # metrics-server 0.9.x supports K8s 1.34+.
  metrics_server: 0.9.0
  # Argo CD 3.5 is tested on K8s 1.33-1.36. 3.x changed defaults vs 2.14 - see
  # documents/DOCUMENTS-runbook-cluster-upgrade-1-36.md before rebuilding a shared cluster.
  argocd: 3.5.3
  # To skip Headlamp installation, set its version to an empty value or comment it out:
  headlamp: 0.26.0
  # MetalLB and ingress-nginx are cluster infrastructure owned by THIS repo. App repos must not
  # install either (two MetalLB installs fight over host ports - speakers stuck Pending).
  # MetalLB 0.16.1 accepts K8s >= 1.19. ingress-nginx 1.15.1 is its FINAL release (project retired
  # March 2026) and is tested only up to K8s 1.35 - see documents/DOCUMENTS-backlog.md #1.
  metallb: 0.16.1
  ingress_nginx: 1.15.1

  os: xUbuntu_22.04
