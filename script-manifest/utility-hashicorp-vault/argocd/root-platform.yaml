# Stage A root Application — app-of-apps (D19). Applied in Phase A1.
#
# Named `utility-hashicorp-vault` (what the ArgoCD UI shows), matching this repo's
# script-manifest/utility-* convention. The file keeps the PRD's "platform root"
# name. Renaming a LIVE Application means deleting it, and the finalizer below
# would then cascade-delete every child — Vault included. Don't rename it once applied.
#
# ############################################################################
# THIS IS THE PLATFORM ROOT ONLY.
#
# Its counterpart, `root-applications.yaml`, lives in the vault repo and must
# NOT be applied during Stage A. A single root app would deploy the Stage B
# levels the moment it synced — before Kubernetes auth exists — producing a
# crash-loop that reads as an application bug and is actually a sequencing
# error. Two roots are what preserve the phase gate.
#
# repoURL is the HTTPS URL, not this repo's SSH host alias (`github.com-adhito909`),
# which ArgoCD can't resolve. The repo is public, so no ArgoCD credential is
# needed; if it is ever made private, register one or use a deploy key.
# ############################################################################
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: utility-hashicorp-vault
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Adhito/poc-platform-engineering-iac-vagrant-ansible-k8s-cluster-kubeadm-calico.git
    targetRevision: main
    path: script-manifest/utility-hashicorp-vault/argocd/applications
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Retry is not optional here. The monitoring child fails its first sync if
    # the Prometheus CRDs have not been cached yet — that is expected, not
    # alarming, and backoff resolves it without intervention.
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
