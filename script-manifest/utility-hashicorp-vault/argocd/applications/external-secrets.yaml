# Wave 3 — the External Secrets Operator itself (Phase A8 step 1).
#
# Split deliberately from the ClusterSecretStore (wave 4): the store is a custom
# resource whose CRD this chart installs. One Application containing both races
# its own CRD and fails the first sync for a reason that looks like a manifest
# error.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # D16 — pinned. Verified 2026-09-22 against ESO's support table: 2.11 is
    # the current line and supports Kubernetes 1.36. ESO releases roughly every
    # three weeks and each minor is supported only until the next, so this goes
    # EOL fast — bump it deliberately rather than letting it float.
    # Its CRDs serve only external-secrets.io/v1 (v1beta1 is served: false), so
    # the ClusterSecretStore must stay on v1.
    targetRevision: 2.11.0
    helm:
      values: |
        installCRDs: true
        # The SA name Vault's `eso` role binds to
        # (bound_service_account_names=external-secrets). Pinned rather than
        # generated — if this name drifts, Vault login fails with a role
        # mismatch that gives no hint about the cause.
        serviceAccount:
          create: true
          name: external-secrets
        webhook:
          create: true
        certController:
          create: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=false
      # The ESO CRDs exceed the annotation size limit for client-side apply.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
