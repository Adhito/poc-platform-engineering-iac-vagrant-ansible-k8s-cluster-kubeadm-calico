# Wave 3 — the External Secrets Operator itself (Phase A8 step 1).
#
# Split deliberately from the ClusterSecretStore (wave 4): the store is a custom
# resource whose CRD this chart installs. One Application containing both races
# its own CRD and fails the first sync for a reason that looks like a manifest
# error.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # D16 — pinned. Verified 2026-09-11 against ESO's support table: 0.13.x is
    # the newest line that supports Kubernetes 1.29 (everything from 0.14 needs
    # >= 1.32), and 0.13.0 is its only release. It is END-OF-LIFE (2025-02-04),
    # accepted with the decision to stay on 1.29. Its ClusterSecretStore CRD
    # serves external-secrets.io/v1beta1 as the storage version — which is why the
    # store uses v1beta1 rather than the v1 the PRD writes.
    targetRevision: 0.13.0
    helm:
      values: |
        installCRDs: true
        # The SA name Vault's `eso` role binds to
        # (bound_service_account_names=external-secrets). Pinned rather than
        # generated — if this name drifts, Vault login fails with a role
        # mismatch that gives no hint about the cause.
        serviceAccount:
          create: true
          name: external-secrets
        webhook:
          create: true
        certController:
          create: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=false
      # The ESO CRDs exceed the annotation size limit for client-side apply.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
