# Wave 4 — the ClusterSecretStore (Phase A8 step 3).
#
# Later than the ESO chart on purpose: this is a custom resource whose CRD that
# chart installs.
#
# It will also stay NotReady until Phase A6/A8 bootstrap has created the Vault
# `eso` role — and a store that cannot authenticate fails QUIETLY. ArgoCD will
# report this Application Synced/Healthy regardless, because the object applied
# fine. "Applied cleanly" is not "working": check the condition itself.
#
#   kubectl get clustersecretstore vault-backend \
#     -o jsonpath='{.status.conditions}'
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Adhito/poc-platform-engineering-iac-vagrant-ansible-k8s-cluster-kubeadm-calico.git
    targetRevision: main
    path: script-manifest/utility-hashicorp-vault/overlays/onprem/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
