apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/external-secrets

# No environment-specific values: the ClusterSecretStore addresses Vault by its
# in-cluster Service name, which is identical on any cluster. The overlay exists
# so every child has the same shape and there is one obvious place to add a patch
# if that ever stops being true.
