# Phase A0 step 6 — the cert-manager trust chain for Vault's TLS (D7).
#
#   selfsigned-bootstrap (ClusterIssuer)
#        └─ issues ──► vault-poc-ca (Certificate, is a CA)
#                           └─ backs ──► vault-poc-ca-issuer (ClusterIssuer)
#                                             └─ issues ──► vault-tls (Phase A2)
#
# TLS is on from Phase A2 onward, not "added later". Retrofitting TLS fails
# reliably: SANs, CA distribution, and every client's config all change at once.
# ESO and Stage B Level 2 both need this CA regardless.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
# The CA certificate itself. Lives in cert-manager's namespace because a
# ClusterIssuer resolves its `secretName` there, not in the consuming namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vault-poc-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: vault-poc-ca
  secretName: vault-poc-ca-key-pair
  duration: 87600h    # 10y — a lab root CA; a real one is ceremony-issued and shorter-lived
  renewBefore: 720h   # 30d
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
    group: cert-manager.io
---
# The issuer Vault's own Certificate references (base/vault-extras/certificate.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-poc-ca-issuer
spec:
  ca:
    secretName: vault-poc-ca-key-pair
