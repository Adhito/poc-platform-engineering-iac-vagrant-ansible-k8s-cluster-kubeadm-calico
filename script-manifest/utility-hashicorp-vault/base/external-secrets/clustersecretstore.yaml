# Phase A8 step 3 — the Level 1 consumption path.
#
# This is what makes "the app doesn't know Vault exists" true: ESO authenticates
# to Vault with its own ServiceAccount, reads the secret, and materialises an
# ordinary Kubernetes Secret. The application then just reads a Secret.
#
# ############################################################################
# TWO DEVIATIONS FROM THE PRD, BOTH DELIBERATE — see README.
#
# 1. apiVersion is `v1beta1`, not `v1` as the PRD writes.
#    The `external-secrets.io/v1` API only exists in newer ESO releases, all of
#    which need a newer Kubernetes than this cluster's 1.29. This build pins ESO
#    0.13.0 — the newest line for 1.29 — whose CRD serves v1beta1 as its storage
#    version (verified 2026-09-11). Move to v1 as part of the Kubernetes upgrade.
#
# 2. caProvider reads the CA from the `vault-tls` SECRET in the `vault`
#    namespace, rather than a copied `vault-ca` ConfigMap in this one.
#    A ClusterSecretStore is cluster-scoped and may reference any namespace, so
#    the copy is avoidable — and a copied CA goes stale the moment cert-manager
#    rotates it, failing as an unexplained TLS error weeks later. Reading the
#    source of truth removes that failure mode and one manual step.
# ############################################################################
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      # In-cluster Service, NOT the MetalLB VIP. The external paths (D8) are for
      # humans; a workload has no reason to leave the cluster network to reach
      # Vault, and routing it out and back in would add a failure mode for free.
      server: "https://vault.vault.svc:8200"
      path: "secret"
      version: "v2"
      caProvider:
        type: Secret
        name: vault-tls
        namespace: vault
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
