# Phase A0 step 6 — cert-manager, pinned to v1.18.6 (2026-02-24).
#
# ############################################################################
# THIS IS AN END-OF-LIFE RELEASE, INSTALLED DELIBERATELY.
#
# cert-manager 1.18 is the newest line that supports Kubernetes 1.29, and it
# reached end of life on 2026-03-10. The cluster owner chose to stay on 1.29 and
# accept that risk (recorded in the vault repo's documents/troubleshooting.md).
# Move to a supported line as part of the Kubernetes upgrade — this component
# issues Vault's TLS, so running it unpatched is not a small thing.
# ############################################################################
#
# Applied directly as an A0 prerequisite, NOT through root-platform — wave 0's
# Certificate needs these CRDs to exist before ArgoCD creates it:
#
#   kubectl apply --server-side -k script-manifest/utility-hashicorp-vault/base/cert-manager
#   kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=300s
#   kubectl apply -k script-manifest/utility-hashicorp-vault/base/cert-manager-issuers
#
# --server-side because the CRDs exceed the client-side apply annotation limit.
# Wait for the webhook before the issuers, or their apply is rejected by a
# webhook that is not serving yet.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - https://github.com/cert-manager/cert-manager/releases/download/v1.18.6/cert-manager.yaml
