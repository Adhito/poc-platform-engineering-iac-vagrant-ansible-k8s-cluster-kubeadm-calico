# Phase A2 step 5 — the two exposure paths (D8).
#
# ############################################################################
# WHY TWO PATHS
#
# They fail differently, which is the entire point.
#
#   vault-lb        MetalLB LoadBalancer. The documented path. Stable VIP,
#                   survives node changes, behaves like a real environment.
#
#   vault-nodeport  Break-glass. If MetalLB's speakers are down, its pool is
#                   exhausted, or ARP misbehaves on the host-only network, this
#                   still works — it depends on nothing but kube-proxy.
#
# A seal event you cannot reach Vault to fix is the worst failure in this
# design, so a second path with a different failure mode earns its keep.
#
# Both target the ACTIVE pod, so writes always land on the Raft leader and no
# request-forwarding or redirect behaviour is involved. TLS is terminated by
# Vault itself on both — nothing proxies or re-encrypts.
# ############################################################################

# ---------- Primary: MetalLB LoadBalancer ----------
apiVersion: v1
kind: Service
metadata:
  name: vault-lb
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    vault-poc/exposure: primary
  # overlays/onprem adds metallb.io/loadBalancerIPs to pin the VIP. It must be
  # pinned, not auto-assigned: the address has to appear in the cert SANs, and a
  # VIP that moves on resync invalidates the certificate.
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    # This selector is the chart's own, set on pods by
    # `service_registration "kubernetes" {}`. Reuse it rather than inventing one —
    # `vault-active: "true"` is what follows the Raft leader during failover.
    app.kubernetes.io/instance: vault
    app.kubernetes.io/name: vault
    component: server
    vault-active: "true"
  ports:
    - name: https
      port: 8200
      targetPort: 8200
      protocol: TCP
---
# ---------- Secondary: NodePort break-glass ----------
apiVersion: v1
kind: Service
metadata:
  name: vault-nodeport
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    vault-poc/exposure: break-glass
spec:
  type: NodePort
  selector:
    app.kubernetes.io/instance: vault
    app.kubernetes.io/name: vault
    component: server
    vault-active: "true"
  ports:
    - name: https
      port: 8200
      targetPort: 8200
      nodePort: 30004
      protocol: TCP
